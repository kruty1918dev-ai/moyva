behaviors:
  MoyvaStrategy:
    trainer_type: ppo
    hyperparameters:
      batch_size: 32
      buffer_size: 128
      learning_rate: 0.0003
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: false
      hidden_units: 32
      num_layers: 1
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 512
    time_horizon: 32
    summary_freq: 128
    checkpoint_interval: 256
    keep_checkpoints: 2
