name: Build Documentation

on:
  push:
    branches:
      - main
      - '**'
    paths:
      - 'docs/**'
      - 'tools/docs/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  delete:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "github.event_name != 'delete' && !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static docs artifact
        run: |
          rm -rf .docs-site
          mkdir -p .docs-site
          cp -a docs/. .docs-site/
          cp tools/docs/site/index.template.html .docs-site/index.html
          cp tools/docs/site/navigation.json .docs-site/pages.json

      - name: Validate documentation artifact
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          root='.docs-site'
          required=['README.md','index.html','pages.json']
          missing=[f for f in required if not os.path.isfile(os.path.join(root,f))]
          if missing:
              print('Missing:', ', '.join(missing))
              sys.exit(1)
          with open(os.path.join(root,'pages.json'),encoding='utf-8') as f:
              data=json.load(f)
          sections=data.get('sections') if isinstance(data,dict) else None
          if not isinstance(sections,list) or not sections:
              print('ERROR: pages.json requires non-empty sections')
              sys.exit(1)
          errors=0
          pages=0
          for i,sec in enumerate(sections):
              for key in ('id','title','icon','pages'):
                  if key not in sec:
                      print(f'ERROR sections[{i}] missing {key}')
                      errors+=1
              for page in sec.get('pages',[]):
                  pages+=1
                  rel=page.get('path')
                  if not rel:
                      errors+=1
                  elif not os.path.isfile(os.path.join(root,rel)):
                      print(f'WARNING missing docs page: {rel}')
          if errors:
              sys.exit(1)
          print(f'pages.json OK: {len(sections)} sections, {pages} pages')
          PYEOF

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './.docs-site'

      - name: Compute preview URL
        if: github.ref != 'refs/heads/main'
        id: preview_url
        run: |
          SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | tr '/[:space:]' '--' | tr -cd '[:alnum:]-')
          echo "domain=preview-${SAFE_BRANCH}-moyva.surge.sh" >> "$GITHUB_OUTPUT"

      - name: Deploy preview to Surge
        if: github.ref != 'refs/heads/main'
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge ./.docs-site "${{ steps.preview_url.outputs.domain }}" --token "$SURGE_TOKEN"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && github.event.ref != 'main'
    steps:
      - name: Compute preview URL
        id: preview_url
        run: |
          SAFE_BRANCH=$(echo "${{ github.event.ref }}" | tr '[:upper:]' '[:lower:]' | tr '/[:space:]' '--' | tr -cd '[:alnum:]-')
          echo "domain=preview-${SAFE_BRANCH}-moyva.surge.sh" >> "$GITHUB_OUTPUT"

      - name: Teardown Surge preview
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          npx --yes surge teardown "${{ steps.preview_url.outputs.domain }}" --token "$SURGE_TOKEN"
