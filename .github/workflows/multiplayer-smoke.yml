name: multiplayer-smoke

on:
  pull_request:
    paths:
      - Assets/Moyva/Scripts/Features/Multiplayer/**
      - Assets/Moyva/Scripts/Features/HomeMenu/**
      - Assets/Moyva/Scripts/Shared/**
      - Assets/Moyva/Scripts/Tests/Multiplayer/**
      - .github/workflows/multiplayer-smoke.yml
  push:
    branches:
      - main
      - feature/**

jobs:
  smoke-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect multiplayer test project
        id: detect
        run: |
          if ls Kruty1918.Moyva.Tests.Multiplayer.csproj >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Kruty1918.Moyva.Tests.Multiplayer.csproj is not present; smoke/performance steps are skipped until the project is committed."
          fi

      - name: Setup .NET
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore multiplayer tests
        if: steps.detect.outputs.exists == 'true'
        run: dotnet restore Kruty1918.Moyva.Tests.Multiplayer.csproj

      - name: Run multiplayer smoke scenarios (host/join/start/reconnect)
        if: steps.detect.outputs.exists == 'true'
        run: >
          dotnet test Kruty1918.Moyva.Tests.Multiplayer.csproj
          --configuration Release
          --no-restore
          --filter "TestCategory=SmokeMultiplayer"

      - name: Run performance acceptance tests
        if: steps.detect.outputs.exists == 'true'
        run: >
          dotnet test Kruty1918.Moyva.Tests.Multiplayer.csproj
          --configuration Release
          --no-restore
          --filter "TestCategory=PerformanceAcceptance"
